# Builds the Windows release whenever a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
# The zip is attached to a draft Release, to check over before publishing it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller PixVault.spec --noconfirm

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PixVault -DestinationPath "PixVault-${{ github.ref_name }}.zip"

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "PixVault-${{ github.ref_name }}.zip" --draft --title "PixVault ${{ github.ref_name }}" --generate-notes
